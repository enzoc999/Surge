<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#000000}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: phone app, one column. Home = briefing of the planned session with an explicit launch button.
   In session = sticky header with exercise rail, one open exercise card at a time, rest launcher docked above the tab bar.
   Records = "Cyberdeck": chamfered cyberware modules with level, rarity and a progress bar toward the next weight step.
   Single deliberate dark look: wine-black ground, rose accent; cyan and yellow only as rarity colours. */
:root{
  color-scheme:dark;
  --bg:#000000; --surface:#131a0f; --surface-2:#23291e; --line:#353a30; --grid:#181817;
  --ink:#f4ece8; --ink-2:#beb8b5; --ink-3:#8e8987;
  --accent:#91ff00; --accent-ink:#0a1400;
  --cy:#38e1f0; --ye:#f5e642;
  --font-display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
  --tabh:60px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(14px + var(--isl,0px)) calc(var(--tabh) + 28px); min-height:100vh; -webkit-tap-highlight-color:transparent;
}
body.has-rest{padding-bottom:calc(var(--tabh) + 130px)}
body.isl-pad{--isl:50px}
body::before{content:"";position:fixed;inset:0 0 auto;height:calc(env(safe-area-inset-top,0px) + var(--isl,0px));background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 85%,transparent) 55%,transparent);z-index:30}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3,p{margin:0}
.disp{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;line-height:1}
h1.disp{font-size:34px}
h1.disp.greet{font-size:30px;line-height:1.05}
h2{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.sub{color:var(--ink-3);font-size:13px}
.num-t{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--ink);text-decoration-color:var(--ink-3);text-underline-offset:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.xl{min-height:58px;font-size:18px;border-radius:14px;letter-spacing:.02em;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.btn[disabled]{opacity:.5;cursor:default}
.link{color:var(--ink-2);font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}

.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.01em;color:var(--m);background:color-mix(in srgb,var(--m) 17%,var(--surface));white-space:nowrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);text-decoration:none;font-size:11.5px;font-weight:600}
.tabs a[aria-current="page"]{color:var(--accent)}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* home */
.selrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.selrow::-webkit-scrollbar{display:none}
.selrow{-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent);padding-right:36px}
.sp{flex:0 0 auto;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:.04em;color:var(--ink-2)}
.sp[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plan{display:flex;flex-direction:column;gap:14px}
.plan .t{font-family:var(--font-display);font-weight:800;font-size:48px;line-height:.92;text-transform:uppercase;letter-spacing:.02em}
.prow{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .n{font-family:var(--font-mono);font-size:15px;color:var(--m);text-align:center}
.prow .main{min-width:0;display:flex;flex-direction:column;gap:3px}
.prow .main b{font-weight:700;overflow-wrap:anywhere}
.prow .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.prow .tg{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--ink-2);text-align:right}
.cta{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);z-index:12;display:flex;flex-direction:column;gap:8px}
.cta .sub{text-align:center;background:var(--bg);border-radius:8px;padding:2px 6px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .main b{font-weight:700}
.li .meta{font-size:13px;color:var(--ink-3)}
.li .end{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);font-size:14px}
.empty{color:var(--ink-3);font-size:14px;padding:6px 0}

/* session */
.shead{gap:6px!important;position:relative;z-index:15;background:none;padding:8px 0 10px;border-bottom:0;display:flex;flex-direction:column;gap:8px;margin-bottom:-6px}
.clock{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.clock svg{width:14px;height:14px;fill:currentColor;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.clock.paused{color:var(--accent);border-color:var(--accent)}
.pbar{height:4px;border-radius:2px;background:var(--grid);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-3);max-width:140px}
.pill i{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--m)}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill[aria-current="true"]{border-color:var(--m);color:var(--ink)}
.pill.done{opacity:.55}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;scroll-margin-top:170px}
.ex-top{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:grid;grid-template-columns:1fr auto;align-items:stretch}
.ex-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 6px 8px 14px;text-align:left;min-height:50px;min-width:0}
.ex-name{font-weight:700;font-size:16.5px;min-width:0;overflow-wrap:anywhere}
.plb{color:#FF8700;font-style:normal}
.cyc .cbar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden;margin-top:10px}.cyc .cbar i{display:block;height:100%;background:var(--accent);border-radius:4px}.cyc.dl{border-color:#FF8700}.cyc.dl .cbar i{background:#FF8700}
.ex-count{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:600}
.swapbtn{width:48px;display:grid;place-items:center;color:var(--ink-2);border-left:1px solid var(--line)}
.swapbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ex.complete .ex-name{color:var(--ink-3)}
.ex.complete .ex-count{color:var(--accent)}
.ex.open{border-color:color-mix(in srgb,var(--m) 45%,var(--line))}
.ex-body{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.tip{color:var(--ink-3);font-size:13.5px}
.coach{background:color-mix(in srgb,var(--m) 12%,var(--surface));border-radius:10px;padding:8px 11px;font-size:13.5px;line-height:1.35}
.coach .last{display:block;margin-top:3px;font-size:12px}
.tipb{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);color:var(--ink-3);font:700 14px/1 var(--font-body,inherit);flex:0 0 auto}
.tipb[aria-pressed=true]{color:var(--ink);border-color:var(--m)}
.sets{gap:6px!important}
.set-n.del{background:var(--accent);color:var(--accent-ink);border-radius:10px;height:44px;font-size:20px}
button.set-n{height:44px;border-radius:10px}
.addset{height:34px;border:1px dashed var(--line);border-radius:10px;font-size:20px;font-weight:700;color:var(--ink-3);width:100%}
.exend{display:flex;gap:8px;justify-content:space-between}
.exend .btn{flex:1}
.exend .btn:disabled{opacity:.35}
.fsel{flex:0 1 128px!important;height:34px;font-size:14px;padding-left:10px}
/* ---- v19 animations ---- */
button,.tabs a,.pill,.tsw,.ex-head{transition:scale .12s ease,background-color .15s,border-color .15s,color .15s,opacity .15s}
button:active:not(:disabled),.tabs a:active,.pill:active{scale:.93}
.ex-head:active{scale:.985}
.tabs a svg{transition:transform .2s}
.tabs a[aria-current="page"] svg{animation:tabpop .42s cubic-bezier(.3,1.7,.5,1)}
@keyframes tabpop{0%{transform:scale(.7) translateY(2px)}60%{transform:scale(1.22) translateY(-3px)}100%{transform:none}}
#app.pg{animation:pgin .24s ease-out}
@keyframes pgin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.check.pop{animation:chkpop .42s cubic-bezier(.3,1.7,.5,1);position:relative}
.check.pop::after{content:"";position:absolute;inset:-2px;border-radius:14px;border:2px solid var(--accent);animation:chkring .5s ease-out forwards;pointer-events:none}
@keyframes chkpop{0%{scale:.6}55%{scale:1.2}100%{scale:1}}
@keyframes chkring{from{opacity:.9;scale:.9}to{opacity:0;scale:1.6}}
.set.new{animation:setin .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes setin{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
.set.gone{animation:setout .2s ease-in forwards}
@keyframes setout{to{opacity:0;transform:translateX(30px) scale(.95)}}
.ex-body.in{animation:exin .26s ease-out}
@keyframes exin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.set-n.del{animation:delpop .26s cubic-bezier(.3,1.7,.5,1)}
@keyframes delpop{from{scale:.4;opacity:0}to{scale:1;opacity:1}}
#sheet{animation:shfade .2s ease-out}
#sheet .p{animation:shup .28s cubic-bezier(.2,1,.3,1)}
@keyframes shfade{from{opacity:0}to{opacity:1}}
@keyframes shup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.exend .btn,.addset{transition:scale .12s,background-color .15s}
.rpopc{animation:rpin .22s ease-out both}
body.rm #app.pg,body.rm .check.pop,body.rm .check.pop::after,body.rm .set.new,body.rm .set.gone,body.rm .ex-body.in,body.rm .set-n.del,body.rm #sheet,body.rm #sheet .p,body.rm .tabs a svg{animation:none!important}
/* ---- v20 ---- */
.ssb{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);color:var(--ink-3);font:800 15px/1 var(--font-display,inherit);flex:0 0 auto;margin-left:auto}
.ssb[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.acc{padding:0;overflow:hidden}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;text-align:left;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.acc-h span{flex:1}
.acc-h em{font-style:normal;font:600 12px var(--font-mono);letter-spacing:.04em;color:var(--accent)}
.acc-h svg{width:12px;height:8px;fill:none;stroke:var(--ink-3);stroke-width:1.8;stroke-linecap:round;transition:transform .2s}
.acc.open .acc-h svg{transform:rotate(180deg)}
.acc-b{padding:2px 16px 16px;display:flex;flex-direction:column;gap:10px;animation:exin .24s ease-out}
.bwrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
#ssfx{position:fixed;inset:0;z-index:70;pointer-events:none;display:none;overflow:hidden}
#ssfx.on{display:block;animation:ssbg 1.7s ease-out forwards}
@keyframes ssbg{0%{background:rgba(0,0,0,0)}12%{background:rgba(0,0,0,.55)}78%{background:rgba(0,0,0,.55)}100%{background:rgba(0,0,0,0)}}
.ssb2{position:absolute;left:-10%;right:-10%;top:50%;transform:translateY(-50%) skewY(-6deg);background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#f5e642));padding:16px 10% 12px;text-align:center;box-shadow:0 0 40px color-mix(in srgb,var(--accent) 70%,transparent);animation:ssbar 1.7s cubic-bezier(.2,1,.3,1) forwards}
@keyframes ssbar{0%{transform:translateY(-50%) skewY(-6deg) translateX(-110%)}16%{transform:translateY(-50%) skewY(-6deg) translateX(0)}82%{transform:translateY(-50%) skewY(-6deg) translateX(0);opacity:1}100%{transform:translateY(-50%) skewY(-6deg) translateX(110%);opacity:0}}
.sst{display:flex;justify-content:center;gap:2px;font-family:var(--font-display,inherit);font-weight:800;font-size:clamp(34px,11vw,52px);letter-spacing:.06em;color:#1a0d10;text-shadow:3px 3px 0 rgba(255,255,255,.55),-2px 0 0 rgba(0,229,255,.7)}
.sst i{font-style:normal;display:inline-block;animation:sslet .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(.12s + var(--k)*.05s)}
@keyframes sslet{from{opacity:0;transform:translateY(-40px) scale(2.4) rotate(-14deg)}to{opacity:1;transform:none}}
.sss{display:flex;justify-content:center;align-items:center;gap:8px;font:700 13px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:#1a0d10;margin-top:2px;animation:sslet .4s .6s both}
.sss b{font-size:16px}
.ssl{position:absolute;left:0;right:0;height:3px;top:calc(50% - 90px);background:#fff;opacity:0;box-shadow:0 0 14px #fff;animation:ssln 1.7s ease-out forwards}
.ssl.b{top:calc(50% + 90px)}
@keyframes ssln{0%{opacity:0;transform:scaleX(0)}20%{opacity:.9;transform:scaleX(1)}80%{opacity:.9}100%{opacity:0}}
body.rm #ssfx.on,body.rm .ssb2,body.rm .sst i,body.rm .sss,body.rm .ssl,body.rm .acc-b{animation-duration:.01s!important;animation-delay:0s!important}
#sheet .p>*{flex-shrink:0}
.frow{display:flex;flex-wrap:wrap;gap:8px}
.fch{height:42px;border-radius:99px;font-weight:700;font-size:14px;border:1px solid var(--line);text-transform:none;letter-spacing:0;font-family:var(--font-body,inherit)}
.erow:disabled{opacity:.4}
#sheet .fl{margin-top:4px}
.ex-tools{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.ex-tools .btn{min-height:34px;padding:0 11px;font-size:13px}
.ex-tools .xsp{flex:1}
.coach b{color:var(--ink)}
.last{font-size:13px;color:var(--ink-3)}
.sets{display:flex;flex-direction:column;gap:8px}
.set.tm,.sets-h.tm{grid-template-columns:22px 1fr 1fr 52px 42px 42px}.wkb{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;display:grid;place-items:center}.wkb svg{width:18px;height:18px}.wkb:disabled{opacity:.3;border-color:var(--line);color:var(--ink-3)}
.set,.sets-h{display:grid;grid-template-columns:22px 1fr 1fr 52px 42px;gap:6px;align-items:center}
.sets-h{font-size:11.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.set-n{font-weight:700;color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.num{width:100%;min-width:0;height:42px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 4px}
.num::placeholder{color:var(--ink-3);opacity:.7;font-weight:500}
.num.bad{border-color:var(--accent)}
.rpeb{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;font-weight:700;color:var(--ink-3);min-width:0;padding:0}
.rpeb.r1{background:color-mix(in srgb,#10B981 22%,var(--surface-2));color:var(--ink);border-color:#10B981}.rpeb.r2{background:color-mix(in srgb,#FF8700 22%,var(--surface-2));color:var(--ink);border-color:#FF8700}.rpeb.r3,.rpeb.r4{background:color-mix(in srgb,#FF3030 22%,var(--surface-2));color:var(--ink);border-color:#FF3030}
.set.done .rpeb{opacity:.6}
.set.done .num{background:transparent;color:var(--ink-3)}
.check{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink-3);background:transparent}
.check svg{width:22px;height:22px}
.set.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acts{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2)}
.step button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);font-weight:700;font-size:16px}
.step output{min-width:44px;text-align:center;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

  width:140px;display:grid;grid-template-rows:auto 0fr;transition:width .5s var(--ease),grid-template-rows .5s var(--ease),border-radius .5s var(--ease),box-shadow .3s}

#bgfx .w2{bottom:-15%;left:-40%;animation:fxA 13s ease-in-out infinite alternate}
#bgfx .c1{top:-12%;left:-40%;animation:fxC 17s ease-in-out infinite alternate}
#bgfx .c2{bottom:-18%;right:-40%;animation:fxA 19s ease-in-out infinite alternate}

<script>
(()=>{

const SHEET_ID='126koD-9YqiHV7HJNxgFHlnRbtP-1_34HsVpQPuL5m10';

const nf=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1});

function buildRecords(sessions,withBase){
  const m={};
  const add=(name,muscle,sets,ts)=>{
    if(NOREC.has(name))return;
    const r=m[name]||(m[name]={name,muscle,maxKg:0,maxKgReps:0,maxKgTs:null,e1:0,e1kg:0,e1reps:0,e1Ts:null,maxReps:0,maxRepsTs:null,n:0,ns:0,bw:true,lv:1});
    const prevKg=r.maxKg,prevReps=r.maxReps,first=r.n===0;
    r.n++;if(ts)r.ns++;
    let bKg=0,bReps=0;
    sets.forEach(s=>{const kg=+s.kg||0,reps=+s.reps||0;if(reps<=0)return;
      if(kg>bKg)bKg=kg;if(reps>bReps)bReps=reps;
      if(kg>0){r.bw=false;
        if(kg>r.maxKg||(kg===r.maxKg&&reps>r.maxKgReps)){r.maxKg=kg;r.maxKgReps=reps;r.maxKgTs=ts}
        if(reps<=12){const e=kg*(1+reps/30);if(e>r.e1){r.e1=e;r.e1kg=kg;r.e1reps=reps;r.e1Ts=ts}}}
      if(reps>r.maxReps){r.maxReps=reps;r.maxRepsTs=ts}});
    if(!first&&(bKg>prevKg||(bKg===0&&prevKg===0&&bReps>prevReps)))r.lv++;
  };
  if(withBase)for(const n in BASE)add(n,muscleOf(n),BASE[n].map(([reps,kg])=>({reps,kg})),null);
  [...sessions].reverse().forEach(s=>s.exercises.forEach(e=>add(e.name,e.muscle,e.sets,s.startedAt)));
  return m;
}

async function syncSheets(auto){

  const values=todo.slice().reverse().flatMap(rowsFor);

function searchRes(q){

    if(seen.has(n))return;seen.add(n);
    const hay=nrm(n+' '+m+' '+formeOf(n)+' '+(MAL[m]||'')+(/^Reverse Fly/.test(n)?' oiseau oiseaux arriere':''));

  }));

  const ss=S.picker&&S.picker.mode==='ss',act=ss?'ss-e':'pick-e';

let dotsRAF=0;
function startDots(){
  cancelAnimationFrame(dotsRAF);
  const cv=document.querySelector('.rdots');if(!cv||!cv.getContext)return;
  const ctx=cv.getContext('2d');if(!ctx)return;
  let rm=false;try{rm=rmOn()}catch(e){}
  const dpr=Math.min(2,window.devicePixelRatio||1);let W=0,H=0,last=0;
  const fit=()=>{const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.max(1,Math.round(W*dpr));cv.height=Math.max(1,Math.round(H*dpr))};
  fit();
  const c=(getComputedStyle(document.documentElement).getPropertyValue('--accent')||'').trim()||'#4f8cff';
  const t0=performance.now();
  const draw=now=>{
    if(!cv.isConnected)return;
    if(!rm)dotsRAF=requestAnimationFrame(draw);
    if(document.hidden||now-last<50&&!rm)return;
    last=now;if(!W||!H){fit();if(!W)return}
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle=c;
    const gap=14,cols=Math.floor(W/gap)+1,rows=Math.floor(H/gap)+1,ox=(W-(cols-1)*gap)/2,oy=(H-(rows-1)*gap)/2,t=rm?0:(now-t0)/1000;
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
      const x=ox+i*gap,y=oy+j*gap,dx=(x-W/2)/(W/2),dy=(y-H*.52)/(H/2),d=Math.hypot(dx*.95,dy);
      const fall=Math.max(0,1-d*d*.85);if(fall<.04)continue;
      const w=.5+.5*Math.sin(d*5-t*.55+Math.sin(i*.35+t*.15)*.4);
      const r=gap*.27*fall*(.45+.55*w);if(r<.4)continue;
      ctx.globalAlpha=Math.min(1,.15+fall*.6)*(LIGHT?.3:.42);
      ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();
    }
  };
  dotsRAF=requestAnimationFrame(draw);
}

    case 'rest-start':{if(a){const idx=restIdx(),sec=S.prefs.restSec||0;if(!sec){S.islOpen=true;paintRest();break}if(idx>=0){const e=a.exercises[idx];unlockAudio();startRest(sec,'Repos · '+e.name,nextText(idx))}}break}
    case 'swap-open':if(a){S.picker={i,muscle:a.exercises[i].muscle};paintSheetEl()}break;
    case 'pick-m':S.picker.muscle=t.dataset.m;paintSheetEl();break;
    case 'pick-e':if(S.picker.mode==='add'&&S.active){addExercise(S.picker.i,t.dataset.m||S.picker.muscle,t.dataset.n)}else if(S.picker.mode==='eadd'&&S.edit){S.edit.d.exercises.push({muscle:t.dataset.m||(LIB[S.picker.muscle]&&LIB[S.picker.muscle].includes(t.dataset.n)?S.picker.muscle:muOf(t.dataset.n)),name:t.dataset.n,forme:formeOf(t.dataset.n),ss:0,sets:[{reps:'',kg:'',rpe:''}]});S.picker=null;paintSheetEl();render()}else swapEx(S.picker.i,t.dataset.m||S.picker.muscle,t.dataset.n);break;
    case 'close-sheet':S.picker=null;paintSheetEl();break;
    case 'finish':if(S.confirm==='finish'){S.confirm=null;finishSession()}else ask('finish');break;
    case 'discard':if(S.confirm==='discard')discardSession();else ask('discard');break;
    case 'del':{const k='del'+t.dataset.id;if(S.confirm===k)delSession(t.dataset.id);else ask(k);break}
    case 'sum-next':if(S.summary){S.summary.step='chest';render();scrTop()}break;
    case 'chest-open':openChest();break;
    case 'summary-close':S.summary=null;S.tab='accueil';try{location.hash='#accueil'}catch(e){}render();scrTop();break;
    case 'rest-add':if(rest&&!rest.over){rest.end+= +t.dataset.v*1000;rest.total=Math.max(5,rest.total+ +t.dataset.v);if(rest.work)rest.work.sec=rest.total;paintRest()}break;
    case 'wk-start':wkStart(i,+t.dataset.j);break;
    case 'rest-skip':{if(rest&&rest.work){wkEnd(false);break}const el=$('#restbar');if(rest&&rest.over&&el){el.classList.add('dismiss');try{if(navigator.vibrate)navigator.vibrate(15)}catch(_){}setTimeout(()=>{el.classList.remove('dismiss');stopRest()},250)}else stopRest();break}
    case 'recm':{const m=t.dataset.m,c=S.recSel||[];S.recSel=(c.length===1&&c[0]===m&&S.recPop===m)?[]:[m];S.recPop=S.recSel[0]||null;render();break}
    case 'rpop-x':S.recSel=[];S.recPop=null;render();break;
    case 'noop':break;
    case 'leg':S.legend=true;render();break;
    case 'leg-x':S.legend=false;render();break;
    case 'gender':S.prefs.gender=t.dataset.v==='f'?'f':'m';savePrefs();render();break;
    case 'rec-view':S.recView=t.dataset.v;S.recSel=[];S.recPop=null;render();break;
    case 'rec-all':{const ms=Object.keys(ANCH.m[S.recView==='back'?'back':'front']),cur=S.recSel||[],on=ms.every(m=>cur.includes(m));S.recSel=on?cur.filter(m=>!ms.includes(m)):[...new Set([...cur,...ms])];render();break}
    case 'mod':S.openMod=S.openMod===t.dataset.n?null:t.dataset.n;render();break;
    case 'curve':S.exSel=t.dataset.n;location.hash='#progres';break;
    case 'range':S.range=+t.dataset.v;render();break;
    case 'ptab':S.progTab=t.dataset.v;render();scrTop();break;
    case 'logout':hostedLogout();break;
    case 'delacc':if(S.confirm==='delacc')hostedDelete();else{S.delMsg='';ask('delacc')}break;
    case 'fb-type':S.fb=Object.assign(S.fb||{},{type:t.dataset.v,msg:(document.getElementById('fb-msg')||{}).value||''});render();break;
    case 'fb-send':hostedFeedback();break;
    case 'fb-again':S.fb={type:'idee'};render();break;
    case 'anim':S.prefs.anim=t.dataset.v;savePrefs();render();break;
    case 'metric':S.metric=t.dataset.v;render();break;
    case 'edit':{const x=S.sessions.find(q=>q.id===t.dataset.id);if(x)openEdit(x);break}
    case 'edit-cancel':S.edit=null;S.tab='progres';try{location.hash='#progres'}catch(e){}render();scrTop();break;
    case 'edit-save':if(S.edit)saveEdit();break;
    case 'edit-add':if(S.edit){S.picker={mode:'eadd',muscle:'Pectoraux'};paintSheetEl()}break;
    case 'eset-add':{if(!S.edit)break;const e=S.edit.d.exercises[i],l=e.sets[e.sets.length-1]||{};e.sets.push({reps:l.reps!=null?l.reps:'',kg:l.kg!=null?l.kg:'',rpe:''});render();break}
    case 'erpe':{if(!S.edit)break;const x=S.edit.d.exercises[i].sets[+t.dataset.j],c=x.rpe;x.rpe=(c===''||c==null)?7:c===7?8:c===8?9:c===9?10:'';render();break}
    case 'eset-del':{if(!S.edit)break;S.edit.d.exercises[i].sets.splice(+t.dataset.j,1);render();break}
    case 'edel-ex':{if(!S.edit)break;const E=S.edit;if(E.conf==='ex'+i){E.d.exercises.splice(i,1);E.conf=null}else{E.conf='ex'+i;setTimeout(()=>{if(S.edit&&S.edit.conf==='ex'+i){S.edit.conf=null;softRender()}},4000)}render();break}
    case 'ex-add':if(a){const e=a.exercises[i];const at=(e&&e.ss===1)?i+2:i+1;S.picker={mode:'add',i:at,muscle:e&&LIB[e.muscle]?e.muscle:'Pectoraux'};paintSheetEl()}break;
    case 'ex-del':if(a){const k='rmex'+i;if(S.confirm===k)removeExercise(i);else ask(k)}break;
    case 'ss-toggle':if(a){const e=a.exercises[i];if(e.ss){unlinkSS(i);persistActive();render()}else{S.picker={mode:'ss',i,muscle:e.muscle,step:'start'};paintSheetEl()}}break;
    case 'ss-in':if(a&&S.picker&&S.picker.mode==='ss')ssLink(S.picker.i,{j:+t.dataset.j});break;
    case 'ss-e':if(t.dataset.m&&S.picker)S.picker.muscle=t.dataset.m;if(a&&S.picker&&S.picker.mode==='ss'){const n=t.dataset.n,j=a.exercises.findIndex(q=>q.name===n);if(j>=0&&j!==S.picker.i&&!a.exercises[j].ss)ssLink(S.picker.i,{j});else if(j<0){const f=formeOf(n);S.picker.step='forme';S.picker.name=n;S.picker.forme=f==='Superset'?'Machine':f;paintSheetEl()}}break;
    case 'ss-f':if(a&&S.picker&&S.picker.mode==='ss')ssLink(S.picker.i,{n:S.picker.name,m:S.picker.muscle,f:t.dataset.f});break;
    case 'ss-back':if(S.picker){S.picker.step='start';paintSheetEl()}break;
    case 'wu-del':if(a){a.warm=null;S.prefs.warmOn=false;savePrefs();persistActive();render()}break;
    case 'wu-add':if(a){a.warm={type:S.prefs.warmType||'Marche',min:S.prefs.warmMin||10,done:false};S.prefs.warmOn=true;savePrefs();persistActive();render()}break;
    case 'wu-min':if(a&&a.warm){a.warm.min=Math.min(90,Math.max(1,a.warm.min+ +t.dataset.v));persistActive();render()}break;
    case 'mood':if(a){a.mood=a.mood===t.dataset.v?'':t.dataset.v;applyMood(a);persistActive();render()}break;
    case 'theme':setTheme(t.dataset.id);break
    case 'theme-from':themeFrom();break
    case 'theme-save':S.themeDraft=null;savePrefs();render();break
    case 'theme-cancel':if(S.themeDraft){S.prefs.theme=JSON.parse(S.themeDraft.prev);S.themeDraft=null;applyTheme();render()}break
    case 'theme-r':{const th=S.prefs.theme;if(th&&th.id==='custom'&&th.custom){if(!S.themeDraft)S.themeDraft={prev:JSON.stringify(th)};const fr=THEMES[th.custom.from||DEF]||THEMES[DEF];th.custom=Object.assign({},th.custom,{[t.dataset.k]:fr[t.dataset.k]});applyTheme();render()}break}
    case 'goal-step':{const g=(S.prefs.goals||[])[i];if(g){g.t=Math.max(1,Math.round((g.t+ +t.dataset.v*(g.u==='kg'?2.5:1))*100)/100);savePrefs();render()}break}
    case 'goal-del':{const k='gdel'+i;if(S.confirm===k){S.prefs.goals.splice(i,1);S.confirm=null;savePrefs();render()}else ask(k);break}
    case 'goal-add':goalAdd();break;
    case 'reset':if(S.confirm==='reset'){resetAll()}else ask('reset');break;
    case 'bk-copy':copyBackup();break;
    case 'bk-import':importBackup();break;
    case 'rpe':{const x=a.exercises[i].sets[+t.dataset.j],c=x.rpe,n=(c===''||c==null)?7:c===7?8:c===8?9:c===9?10:'';x.rpe=n;adaptEx(a.exercises[i]);persistActive();render();break}
    case 'img-sess':if(S.summary)imgSess(S.summary.sess,t);break;
    case 'img-week':imgWeek(t);break;
    case 'pickprog':pickProg(t.dataset.v);break;
    case 'thumb':S.prefs.thumb=!S.prefs.thumb;savePrefs();render();break;
    case 'restauto':S.prefs.restAuto=S.prefs.restAuto===false;savePrefs();render();break;
    case 'volwk':S.volWk=+t.dataset.v;render();break;
    case 'recmode':S.recMode=t.dataset.v;render();break;
    case 'recspan':S.recSpan=+t.dataset.v;render();break;
    case 'cyc-new':S.prefs.cycle={start:weekStart(Date.now()),len:8};savePrefs();render();break;
    case 'tip':S.tipEx=S.tipEx===i?null:i;render();break;
    case 'acc':{S.plusOpen=S.plusOpen||{};const k=t.dataset.id;S.plusOpen[k]=!S.plusOpen[k];render();break}
    case 'ex-up':if(a)moveUnit(i,-1);break;
    case 'ex-down':if(a)moveUnit(i,1);break;
    case 'wu-done':if(a&&a.warm){const w=a.warm;w.done=true;S.prefs.warmType=w.type;S.prefs.warmMin=w.min;savePrefs();persistActive();render()}break;
    case 'wu-redo':if(a&&a.warm){a.warm.done=false;persistActive();render()}break;
    case 'isl-toggle':S.islOpen=!S.islOpen;paintRest();break;
    case 'hist-all':S.histAll=!S.histAll;render();break;
    case 'bw':S.prefs.bw=Math.round(Math.max(30,Math.min(250,(S.prefs.bw||80)+ +t.dataset.v))*10)/10;S.prefs.bwAt=Date.now();bwLogAdd();savePrefs();render();break;
    case 'sync':syncSheets(false);break;
    case 'pull':pullSheet(false);break;
    case 'unit-tg':if(a){const e=a.exercises[i];if(e){const was=TIMED.has(e.name);UOV[e.name]=was?'reps':'sec';S.prefs.unitOv=Object.assign({},UOV);savePrefs();e.sets.forEach(q=>{if(!q.done)q.reps=was?10:30});persistActive();render()}}break;
    case 'copy':copyRows();break;
  }
});
function applyMeta(t){
  const d=S.edit.d,k=t.dataset.em,v=t.value;
  if(k==='date')d._date=v;else if(k==='time')d._time=v;
  else if(k==='dur')d._dur=v===''?'':Math.max(0,Math.round(parseNum(v)||0));
  else if(k==='warm')d._warm=v===''?'':Math.max(0,Math.round(parseNum(v)||0));
  else if(k==='bw'){const x=parseNum(v);d._bw=x===''?'':x}
}
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.em&&S.edit){applyMeta(t);return}
  if(t.dataset&&t.dataset.ef&&S.edit){
    const row=t.closest('.set');if(!row)return;
    const x=S.edit.d.exercises[+row.dataset.i].sets[+row.dataset.j],f=t.dataset.ef,v=parseNum(t.value);
    if(f==='rpe')x.rpe=v===''?'':Math.min(10,Math.max(1,Math.round(v)));
    else if(f==='reps')x.reps=v===''?'':Math.max(0,Math.round(v));
    else x.kg=v===''?'':Math.max(0,v);
    return;
  }
  if(t.dataset&&t.dataset.f&&S.active){
    const row=t.closest('.set');if(!row)return;
    const s=S.active.exercises[+row.dataset.i].sets[+row.dataset.j],f=t.dataset.f,v=parseNum(t.value);
    if(f==='rpe')s.rpe=v===''?'':Math.min(10,Math.max(1,Math.round(v)));
    else if(f==='reps'){if(row.classList.contains('tm')){const q=parseT(t.value);s.reps=q===''?'':Math.max(0,q);t.value=s.reps===''?'':fmtS(s.reps)}else s.reps=v===''?'':Math.max(0,Math.round(v))}
    else s.kg=v===''?'':Math.max(0,v);
    t.classList.remove('bad');persistActive();
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t&&t.dataset&&t.dataset.act==='theme-c'){const th=S.prefs.theme;if(th&&th.id==='custom'){if(!S.themeDraft)S.themeDraft={prev:JSON.stringify(th)};th.custom=Object.assign({},th.custom,{[t.dataset.k]:t.value});applyTheme();{const sv=document.querySelector('[data-act=theme-save]');if(sv){sv.disabled=false;sv.textContent='Sauvegarder'}const cn=document.querySelector('[data-act=theme-cancel]');if(cn)cn.hidden=false}const rb=t.parentNode&&t.parentNode.querySelector('[data-act=theme-r]');if(rb){const fr=THEMES[th.custom.from||DEF]||THEMES[DEF];rb.disabled=String(t.value).toLowerCase()===String(fr[t.dataset.k]).toLowerCase()}}}
});
document.addEventListener('input',ev=>{
  const t=ev.target;if(!t||!t.dataset)return;
  if(t.dataset.duoin){S.duo=S.duo||{};S.duo.in=t.value;return}
  if(t.dataset.cp&&S.active){const e=S.active.exercises[+t.dataset.i];if(e){e.cp=e.cp||{};e.cp[t.dataset.cp]=t.value;persistActive()}return}
  if(t.dataset.cin&&S.coach){S.coach.txt=t.value;return}
  if(t.dataset.pf){const k=t.dataset.pf;if(k==='name')S.prefs.name=t.value.trim();else{const P=S.prefs.profile=S.prefs.profile||{};P[k]=t.value}savePrefs()}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.em&&S.edit){applyMeta(t);return}
  if(t.dataset&&t.dataset.th){setTheme(t.value);return}
  if(t.dataset&&t.dataset.act==='goal-sel'){S.goalSel=t.value;return}
  if(t.dataset&&t.dataset.act==='wu-type'&&S.active&&S.active.warm){S.active.warm.type=t.value;persistActive();return}
  if(t.dataset&&t.dataset.act==='forme'&&S.active){S.active.exercises[+t.dataset.i].forme=t.value;persistActive();render()}
  else if(t.id==='exsel'){S.exSel=t.value;render()}
  else if(t.dataset&&t.dataset.f&&S.active){const row=t.closest('.set');if(row){const s=S.active.exercises[+row.dataset.i].sets[+row.dataset.j];if(t.dataset.f==='rpe')t.value=inpVal(s.rpe)}}
});
document.addEventListener('click',ev=>{if(ev.target&&ev.target.id==='sheet'){S.picker=null;paintSheetEl()}});
window.addEventListener('hashchange',route);
document.querySelectorAll('.tabs a').forEach(l=>l.addEventListener('click',()=>{if(S.needProg){S.needProg=false;setTimeout(route,0)}}));
document.addEventListener('touchstart',e=>{const t=e.touches&&e.touches[0];if(t)dragStart(e.target,t.clientY)},{passive:true});
document.addEventListener('touchmove',e=>{const t=e.touches&&e.touches[0];if(!t)return;drag.y=t.clientY;if(drag.on)e.preventDefault();else if(drag.timer&&Math.abs(t.clientY-drag.sy)>10){clearTimeout(drag.timer);drag.timer=null}},{passive:false});
document.addEventListener('touchend',dragEnd);document.addEventListener('touchcancel',dragEnd);
document.addEventListener('mousedown',e=>{if(e.button===0)dragStart(e.target,e.clientY)});
document.addEventListener('mousemove',e=>{drag.y=e.clientY;if(!drag.on&&drag.timer&&Math.abs(e.clientY-drag.sy)>10){clearTimeout(drag.timer);drag.timer=null}});
document.addEventListener('mouseup',dragEnd);
document.addEventListener('contextmenu',e=>{if(drag.on||(e.target&&e.target.closest&&e.target.closest('.ex-head')))e.preventDefault()});
document.addEventListener('click',e=>{if(Date.now()<blockClickUntil){e.stopPropagation();e.preventDefault()}},true);

/* ---------- boot ---------- */
if(S.active){S.openEx=firstOpen();wake()}
route();
initDb();
splash();
})();
</script>
